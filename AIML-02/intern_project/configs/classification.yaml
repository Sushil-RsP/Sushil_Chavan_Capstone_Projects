# DenseNet121 Classification Configuration
# NIH ChestX-ray14 multi-label chest X-ray classification

task: multi-label-classification
dataset: nih-chestxray14
model_architecture: densenet121
model_version: "0.1"

labels:
  - Atelectasis
  - Cardiomegaly
  - Consolidation
  - Edema
  - Effusion
  - Emphysema
  - Fibrosis
  - Hernia
  - Infiltration
  - Mass
  - "No Finding"
  - Nodule
  - Pleural_Thickening
  - Pneumonia
  - Pneumothorax

num_classes: 15

uncertain_label_policy: exclude
# "exclude" means samples where a label confidence < 0.5 are excluded
# from binary cross-entropy loss for that label.

preprocessing:
  resize: 256
  crop: 224
  mean: [0.485, 0.456, 0.406]  # ImageNet stats (proxy; replace with dataset stats)
  std: [0.229, 0.224, 0.225]

augmentation:
  horizontal_flip: true
  rotation_degrees: 10
  color_jitter:
    brightness: 0.1
    contrast: 0.1

training:
  seed: 42
  batch_size: 32
  epochs: 50
  optimizer: adam
  learning_rate: 0.001
  weight_decay: 0.0001
  scheduler: cosine_annealing
  checkpoint_dir: models/classification/
  early_stopping_patience: 10

evaluation:
  threshold: 0.5
  metrics:
    - roc_auc
    - precision
    - recall
    - f1
    - confusion_matrix

split:
  # Patient-level splits to prevent data leakage
  train_fraction: 0.7
  val_fraction: 0.1
  test_fraction: 0.2
  seed: 42
